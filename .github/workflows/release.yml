# Builds Pyx for Apple Silicon, Intel and both (universal), and attaches the
# disk images to a draft GitHub release whose notes come from CHANGELOG.md. Runs when a version tag (v1.2.3) is
# pushed, or by hand from the Actions tab for an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and attach the downloads to, e.g. v0.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: macOS (${{ matrix.label }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - label: Intel
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - label: Universal
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # The release notes: this version's CHANGELOG.md section, then how to download.
      # Fails the build when the changelog has no section for the tag.
      - id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            python3 .github/scripts/release-notes.py "${{ inputs.tag || github.ref_name }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Pyx ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
